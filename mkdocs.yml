site_name: 无聊小明
# site_url: https://mydomain.org/mysite
theme:
  name: material
  favicon: assets/favicon.ico
  icon:
    logo: material/rocket-outline
    # logo: material/rocket-launch

  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.path
    - navigation.prune
    # - navigation.footer
    - toc.follow
    - navigation.top

  palette:
    - media: "(prefers-color-scheme: light)"
      primary: white
      # primary: light green
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: black
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - blog:
      blog_toc: true
      pagination_per_page: 5
      # archive_pagination_per_page: 10
      # categories_pagination_per_page: 10
      post_date_format: medium
      post_excerpt: required
      post_excerpt_max_categories: 2
      pagination_format: "$link_first $link_previous ~2~ $link_next $link_last"


extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

nav:
  - Home: index.md
  
  - CS & Software:
    - Linux:
      - CS & Software/systemd.md
      - CS & Software/linux-perf.md
      - CS & Software/tmux.md
    - CS:
      - CS & Software/bnf.md
    - 企业应用设计:
      - CS & Software/ea-index.md
      - CS & Software/ea-model-design.md
      - CS & Software/ea-model-wide-table.md
      - CS & Software/ea-model-design-eav.md
  - Other:
    - 家居:
      - other/铝型材.md

  - Blog:
    - blog/index.md
  
