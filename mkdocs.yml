site_name: 无聊的牛顿
# site_url: https://mydomain.org/mysite
theme:
  name: material
  favicon: assets/favicon.ico

  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - navigation.path
    - navigation.prune
    # - navigation.footer
    - toc.follow
    - toc.integrate

  palette:
    - media: "(prefers-color-scheme: light)"
      primary: white
      # primary: light green
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: black
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY

nav:
  - Home: index.md
  - EE:
    - DIY:
      - EE/diy-做一盏灯.md

  - CS & Software:
    - ToB 业务设计
    - CS & Software/tob-model-design.md
    - CS & Software/tob-bz-model-wide-table.md
    - CS & Software/tob-model-design-eav.md
  
  - 生活记录:
    - 闯入记忆:
      - 生活记录/面对旷野.md
      - 生活记录/旷日持久的咳.md
     